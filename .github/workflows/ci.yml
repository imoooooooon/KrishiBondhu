# Runs on every PR into staging/main and every push to those branches.
# Uses a throwaway MySQL 8.4 container; no repository secrets are used.
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: krishibondhu_test
          MYSQL_USER: krishibondhu
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: krishibondhu_test
      DB_USERNAME: krishibondhu
      DB_PASSWORD: ci-only-password

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, zip, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies from composer.lock
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create CI environment file
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Check PHP formatting and syntax (Pint)
        run: vendor/bin/pint --test

      - name: Verify the application boots
        run: php artisan about --only=environment

      - name: Check MySQL connectivity
        run: php artisan db:show --database=mysql

      - name: Run tests
        run: php artisan test
